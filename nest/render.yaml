# Render service definition for the Susi Air Pilot backend (NestJS).
# `render yaml` / auto-import reads this on "New Web Service" for repo
# syafaatashan/susiair-pilot, rootDir nest/.
#
# JWT_SECRET is generated by Render (generateValue: true) so the committed repo
# never contains a production secret. NODE_ENV=production makes AuthModule
# refuse to boot without it (defence in depth).
services:
  - type: web
    name: susiair-pilot-api
    env: node
    rootDir: nest
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
