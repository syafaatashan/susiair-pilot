name: keepalive

# Ping the Render Free backend every 10 min (UTC) so it never crosses the
# 15-min idle window that triggers spin-down (~50s cold-start penalty).
# Free tier web services always sleep; this external heartbeat is the only
# way to keep one warm without upgrading to a paid plan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render Free instance
        # A sleeping Render Free instance needs 30-90s to boot, so a short
        # timeout reports a false failure. Give each attempt 120s and retry:
        # the request either wakes the instance or confirms it is already up.
        run: >
          curl -sS --fail --retry 2 --retry-delay 5 --retry-all-errors
          -o /dev/null -m 120
          https://susiair-pilot-api.onrender.com/health
